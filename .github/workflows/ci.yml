name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[all]" ruff mypy types-PyYAML
      - run: ruff check src tests
      - run: mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]" hypothesis pytest-cov
      - run: pytest -m "not server" --cov --cov-report=term

  # Runs the tests that need real database servers, started from docker-compose.
  servers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" hypothesis
      - run: docker compose -f tests/docker-compose.yml up -d --wait
      - run: pytest -m server
        env:
          DATANYX_TEST_SERVERS: "1"
      - if: always()
        run: docker compose -f tests/docker-compose.yml down
