name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --locked
      - run: uv run ruff check src tests
      - run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras --locked
      - run: uv run pytest -m "not server" --cov --cov-report=term

  # The text tests need the large NER models, so they run once rather than in every cell.
  text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --group models --locked
      - run: uv run pytest tests/test_text.py tests/test_text_model.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --group docs --locked
      - run: uv run python tools/gen_cli_reference.py --check
      - run: uv run mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"

  # Runs the tests that need real database servers, started from docker-compose.
  servers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --locked
      - run: docker compose -f tests/docker-compose.yml up -d --wait
      - run: uv run pytest -m server
        env:
          DATANYX_TEST_SERVERS: "1"
      - if: always()
        run: docker compose -f tests/docker-compose.yml down
