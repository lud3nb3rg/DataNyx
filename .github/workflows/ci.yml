name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --all-extras --locked
      - run: uv run ruff check src tests
      - run: uv run mypy

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras --locked
      - run: uv run pytest -m "not server" -n auto --cov --cov-report=term

  # The text tests need the large NER models, so they run once rather than in every cell.
  text:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --all-extras --group models --locked
      # Each worker loads the models, so two rather than one per core.
      - run: uv run pytest -n 2 tests/test_text.py tests/test_text_model.py
      - run: uv run pytest -n 2 -m needs_model
      # The detection accuracy numbers (docs/anonymization.md), measured on this commit. The test above fails if
      # they drop; the table is also shown on the run's summary page.
      - run: uv run python tools/ner_benchmark.py >> "$GITHUB_STEP_SUMMARY"

  # The package builds, its metadata is valid, and the container image builds and runs.
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv build
      - run: uvx twine check dist/*
      - run: docker build -t datanyx .
      - run: docker run --rm datanyx doctor

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --all-extras --group docs --locked
      - run: uv run python tools/gen_cli_reference.py --check
      - run: uv run mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"

  # Runs the tests that need real database servers, started from docker-compose.
  servers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --all-extras --locked
      - run: docker compose -f tests/docker-compose.yml up -d --wait
      - run: uv run pytest -m server
        env:
          DATANYX_TEST_SERVERS: "1"
      - if: always()
        run: docker compose -f tests/docker-compose.yml down
