name: Release

# Publishing runs when a version tag is pushed (git tag v0.2.0 && git push --tags). What a release is made of:
#   - the wheel and sdist on PyPI, by trusted publishing, which also attaches PyPI's own attestations;
#   - a GitHub build-provenance attestation for the wheel and sdist, and a CycloneDX list of what is in them;
#   - a signed container image on ghcr.io, with its provenance and SBOM;
#   - a GitHub Release with those files and the notes from CHANGELOG.md.
# `docs/deployment.md` says how to verify each. Running this workflow by hand (Actions > Release > Run workflow)
# builds everything and publishes nothing, to check the workflow itself.
#
# One-time setup, no secrets needed:
#   1. On pypi.org, add a "pending publisher" for this repository: workflow release.yml, environment pypi.
#   2. In the repository settings, create an environment named "pypi" (add required reviewers if you want a gate).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Each job asks for what it needs beyond this. Actions are pinned to commits, because a tag can be
# moved and these jobs can publish; Dependabot proposes the updates.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: The tag must match the version in pyproject.toml
        if: github.ref_type == 'tag'
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} does not match version $version" >&2; exit 1; }
      - run: uv build
      - run: uvx twine check dist/*
      - name: A list of what the package depends on, as locked (CycloneDX)
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          uv export --format cyclonedx1.5 --frozen --no-dev --no-default-groups --all-extras -o "dist/datanyx-${version}.cdx.json"
      - name: The release notes come from CHANGELOG.md
        if: github.ref_type == 'tag'
        run: python3 tools/release_notes.py "${GITHUB_REF_NAME#v}" > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: release-notes
          path: release-notes.md

  pypi:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # PyPI takes the wheel and sdist only; the SBOM goes on the GitHub Release. Attestations are made automatically.
      - run: rm -f dist/*.cdx.json
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  # A signed statement, checkable with `gh attestation verify`, that these files were built by this workflow.
  attest:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  docker:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      # Provenance and an SBOM are stored in the registry beside the image.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.ref_type == 'tag'
      # Keyless: the signature names this workflow, so it can't be made anywhere else.
      - name: Sign the image
        if: github.ref_type == 'tag'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY,,}@${DIGEST}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.ref_type == 'tag'
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # The GitHub Release page: the notes from CHANGELOG.md, the wheel, the sdist and the SBOM.
  release:
    needs: [build, pypi, attest, docker]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "DataNyx ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --verify-tag
