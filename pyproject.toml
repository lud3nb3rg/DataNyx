[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "datanyx"
version = "0.2.0"
description = "Turn sensitive data into a value-free schema that AI agents can work from."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai-agents", "privacy", "schema", "anonymization", "data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["sqlalchemy>=2", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1", "cryptography"]
mssql = ["pymssql>=2.3"]
oracle = ["oracledb>=2"]
parquet = ["pyarrow>=14"]
excel = ["openpyxl>=3.1"]
yaml = ["pyyaml>=6"]
streaming = ["ijson>=3.2"]
mcp = ["mcp>=1.2"]
avro = ["fastavro>=1.9"]
orc = ["pyarrow>=14"]
duckdb = ["duckdb>=1.0"]
# pyreadstat publishes no Windows wheel for Python 3.10, and building it there needs a C library, so
# the extra is empty on that one platform and SAS, Stata and SPSS files report that they need it.
stats = ["pyreadstat>=1.2; sys_platform != 'win32' or python_version >= '3.11'"]
mongodb = ["pymongo>=4.6"]
ddl = ["sqlglot>=25"]
bigquery = ["sqlalchemy-bigquery>=1.9"]
snowflake = ["snowflake-sqlalchemy>=1.5"]
# Files at a URL: https needs aiohttp, and each cloud store has its own fsspec package.
# .gz, .bz2 and .xz are read with the standard library; .zst needs this.
zstd = ["zstandard>=0.22"]
remote = ["fsspec>=2024.2", "aiohttp>=3.9"]
s3 = ["fsspec>=2024.2", "s3fs>=2024.2"]
gcs = ["fsspec>=2024.2", "gcsfs>=2024.2"]
azure = ["fsspec>=2024.2", "adlfs>=2024.2"]
all = ["datanyx[postgres,mysql,mssql,oracle,parquet,excel,yaml,streaming,mcp,check,pdf,presidio,avro,orc,duckdb,stats,mongodb,zstd,ddl,bigquery,snowflake,remote,s3,gcs,azure]"]
text = ["spacy>=3.7"]
check = [
    "sqlglot>=25",
]
pdf = [
    "pypdf>=4",
]
presidio = [
    "presidio-analyzer>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3.5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "pandas>=2.3.3",
    "mongomock>=4.1",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
# Large NER models, installed from spaCy's releases. Needed only by the text tests.
models = [
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
    "fr-core-news-md @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_md-3.8.0/fr_core_news_md-3.8.0-py3-none-any.whl",
]

[project.urls]
Homepage = "https://github.com/lud3nb3rg/DataNyx"
Documentation = "https://lud3nb3rg.github.io/DataNyx/"
Source = "https://github.com/lud3nb3rg/DataNyx"
Changelog = "https://github.com/lud3nb3rg/DataNyx/blob/main/CHANGELOG.md"
Issues = "https://github.com/lud3nb3rg/DataNyx/issues"

[project.scripts]
datanyx = "datanyx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "server: needs a real database server, started from tests/docker-compose.yml",
    "needs_model: runs the default spaCy model, which only some CI jobs install",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501", "B904", "SIM105", "RUF012",
    "B905",    # zip() on rows of unequal length is intended: short rows leave columns out.
    "RUF001",  # Typographic apostrophes and dotless i are test data and word lists.
    "SIM115",  # Streams that must outlive a `with` block (stdin, SQLite handles).
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "B028", "SIM117"]

[tool.mypy]
python_version = "3.10"
files = ["src/datanyx"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.coverage.run]
source = ["src/datanyx"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# CI measures about 90% without the NER models. The floor catches a new module that ships with no tests.
fail_under = 88

[[tool.mypy.overrides]]
module = "datanyx.mcp_server"
# Which of the two MCP library versions is installed decides which ignores are needed.
warn_unused_ignores = false

[tool.uv]
default-groups = ["dev"]
