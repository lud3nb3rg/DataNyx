[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datanyx"
version = "0.1.0"
description = "Turn sensitive data into a value-free schema that AI agents can work from."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ai-agents", "privacy", "schema", "anonymization", "data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["sqlalchemy>=2"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1", "cryptography"]
mssql = ["pymssql>=2.3"]
oracle = ["oracledb>=2"]
parquet = ["pyarrow>=14"]
excel = ["openpyxl>=3.1"]
yaml = ["pyyaml>=6"]
streaming = ["ijson>=3.2"]
mcp = ["mcp>=1.2"]
all = ["datanyx[postgres,mysql,mssql,oracle,parquet,excel,yaml,streaming,mcp]"]
text = ["spacy>=3.7"]
dev = ["pytest>=8", "hypothesis>=6", "datanyx[all,text]"]

[project.scripts]
datanyx = "datanyx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["server: needs a real database server, started from tests/docker-compose.yml"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501", "B904", "SIM105", "RUF012",
    "B905",    # zip() on rows of unequal length is intended: short rows leave columns out.
    "RUF001",  # Typographic apostrophes and dotless i are test data and word lists.
    "SIM115",  # Streams that must outlive a `with` block (stdin, SQLite handles).
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "B028", "SIM117"]

[tool.mypy]
python_version = "3.10"
files = ["src/datanyx"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.coverage.run]
source = ["src/datanyx"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[[tool.mypy.overrides]]
module = "datanyx.mcp_server"
# Which of the two MCP library versions is installed decides which ignores are needed.
warn_unused_ignores = false
